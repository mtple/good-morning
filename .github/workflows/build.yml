# Builds the app on a Mac for every push, so a change that doesn't compile shows up before anyone opens Xcode,
# then launches it, types into it and saves screenshots of each step (the "screenshots" artifact).
# Built unsigned, so without the sandbox: smoke.sh can then point it at a pages folder through its defaults.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project GoodMorning.xcodeproj -target GoodMorning -configuration Debug \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - name: Smoke run
        continue-on-error: true
        run: .github/scripts/smoke.sh build/Debug/GoodMorning.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
